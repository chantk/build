ATF_PLAT="sun50i_h6";
source "${BASH_SOURCE%/*}/include/sunxi64_common.inc"
OVERLAY_PREFIX='sun50i-h6'
[[ -z $CPUMIN ]] && CPUMIN=480000
[[ -z $CPUMAX ]] && CPUMAX=1810000
GOVERNOR=ondemand
ASOUND_STATE='asound.state.sun50iw2-dev'

if [[ $BOARD == tanix-tx6 || $BOARD == bosstv ]]; then
	case $BRANCH in
		legacy)
			LINUXFAMILY=station
			KERNELSOURCE=$MAINLINE_KERNEL_SOURCE
			KERNELBRANCH="branch:linux-5.10.y"
			KERNELPATCHDIR='station-'$BRANCH
			LINUXCONFIG='linux-station-'$BRANCH
		;;
		current)
			LINUXFAMILY=station
			KERNELSOURCE=$MAINLINE_KERNEL_SOURCE
			KERNELBRANCH="branch:linux-5.15.y"
			KERNELPATCHDIR='station-'$BRANCH
			LINUXCONFIG='linux-station-'$BRANCH
		;;
		edge)
			LINUXFAMILY=station
			KERNELSOURCE=$MAINLINE_KERNEL_SOURCE
			KERNELBRANCH="branch:linux-5.16.y"
			KERNELPATCHDIR='station-'$BRANCH
			LINUXCONFIG='linux-station-'$BRANCH
		;;
	esac
fi

family_tweaks_bsp()
{
	if [[ $BOARD == bosstv ]]; then
		display_alert "Installing" "BossTV UWE5622 firmware and Bluetooth attach" "info"
		rsync -a "${SRC}/packages/bsp/bosstv/" "${destination}/"
	fi
}
