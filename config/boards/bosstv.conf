# BossTV, Allwinner H6, Tanix TX6 hardware.
# USB3 VBUS is PL5 on the USB3 PHY. WiFi is Unisoc UWE5622, not XR819.
BOARD_NAME="BossTV"
BOARDFAMILY="sun50iw6"
BOOTCONFIG="tanix_tx6_defconfig"
KERNEL_TARGET="current"
FULL_DESKTOP="yes"
ATFBRANCH="tag:v2.2"
BOOT_FDT_FILE="allwinner/sun50i-h6-bosstv.dtb"
SRC_EXTLINUX="yes"
EXTRAWIFI="no"
SRC_CMDLINE="console=ttyS0,115200 console=tty0 mem=2048M video=HDMI-A-1:e"
OFFSET=16
